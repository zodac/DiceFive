org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# A warning in a *.gradle.kts build script fails the build - in practice, a deprecated Gradle/AGP API
# used by the build itself. The build-script counterpart of the app's DEPRECATION compiler flag and
# lint rule (app/android/build.gradle.kts).
org.gradle.kotlin.dsl.allWarningsAsErrors=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false

# excludeLibraryComponentsFromConstraints only helps project-import performance on very large
# multi-module projects; this one is small enough that it's not worth enabling, but AGP nags about
# it on every sync/build unless these two are set.
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
android.sync.suppressAgpWarnings=LIBRARY_CONSTRAINTS_SHOULD_BE_DISABLED

# The shared module's iOS targets compile (to .klib) on any host, which is what proves its common code
# is really platform-neutral - but linking an iOS binary and running its tests needs macOS. Those
# tasks are skipped on Linux and Windows rather than warned about on every build.
kotlin.native.ignoreDisabledTargets=true
