# -XX:+UseCompactObjectHeaders (JEP 519, a product flag since JDK 25) shrinks every object's header
# from 12 to 8 bytes: less heap and GC work for the daemon, and the Kotlin daemon inherits these args.
# --enable-native-access: Gradle's own native-platform library calls System.load, which JDK 24+ warns
# about on every build unless the daemon is allowed native access (JEP 472). Gradle's code, not ours.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED -XX:+UseCompactObjectHeaders
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# A warning in a *.gradle.kts build script fails the build - in practice, a deprecated Gradle/AGP API
# used by the build itself. The build-script counterpart of the app's DEPRECATION compiler flag and
# lint rule (app/android/build.gradle.kts).
org.gradle.kotlin.dsl.allWarningsAsErrors=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# AGP 9's default is off. On, every classpath of the app resolves the versions its runtime does: off, the app compiles
# against older ones than it ships (on 2026-10-28: kotlinx-coroutines 1.9.0 against 1.11.0, lifecycle 2.10.0 against 2.11.0).
android.dependency.useConstraints=true

# excludeLibraryComponentsFromConstraints only helps project-import performance on very large
# multi-module projects; this one is small enough that it's not worth enabling, but AGP nags about
# it on every build unless this is set. (AGP also suggests android.sync.suppressAgpWarnings for
# this, but that's an IDE-sync-only flag - passing it to a CLI build just adds its own "experimental
# option" warning instead.)
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
