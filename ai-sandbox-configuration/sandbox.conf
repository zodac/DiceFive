# The sandbox settings for this project, read by ai-sandbox/sandbox.sh on every launch.
#
# Plain bash, sourced on the HOST. Every value is a space-separated string, and an environment
# variable of the same name overrides it for one launch (`SANDBOX_PORTS= ai-sandbox/sandbox.sh`).
# See ai-sandbox/README.md for the full reference.

# Ports published to the host, as `host:container` pairs. DiceFive runs no in-sandbox server, and an
# unused published port is only a collision risk against the host's own stack, so nothing is published.
SANDBOX_PORTS=""

# Named cache volumes, as `name:/container/path` pairs - each survives the sandbox's teardown as the
# docker volume `<sandbox-name>-<name>`:
#   gradle - the Gradle distribution itself plus every AGP/Kotlin/AndroidX/Compose dependency (the
#            slow part of a first build)
#   m2     - the android-all jars Robolectric downloads for the unit tests (~600MB)
#   pw     - a Playwright Chromium, if a session installed one (`npx playwright@<pin> install chromium`)
SANDBOX_CACHE_VOLUMES="gradle:/home/dev/.gradle m2:/home/dev/.m2 pw:/home/dev/.cache/ms-playwright"

# Directories (relative to the project root, "." = the root) whose package.json gets an
# `npm install` on each interactive open. DiceFive has no Node side.
SANDBOX_NPM_DIRS=""

# Extra environment for the sandbox, as KEY=VALUE pairs (no spaces inside a value). EMULATOR_API,
# JAVA_HOME and ANDROID_HOME come from the Dockerfile's ENV, so nothing is needed here.
SANDBOX_ENV=""

# Extra `docker run` flags, passed through as-is. /dev/kvm (for the emulator) is already reachable:
# the sandbox is --privileged, and bin/emulator.sh opens it to `dev`.
SANDBOX_RUN_ARGS=""

# Days of Claude session history (transcripts, file history, tool results) to keep in
# .claude-history; anything older is deleted when Claude starts. Memory and settings are always kept.
SANDBOX_HISTORY_DAYS=14

# Pin the docker name prefix instead of deriving it from this checkout's path (rarely needed).
# SANDBOX_NAME=""

# The sandbox's timezone (an IANA name); defaults to the host's.
# SANDBOX_TZ=""
