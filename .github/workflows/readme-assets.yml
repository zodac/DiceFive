name: README assets

# The images README.md shows - the feature graphic (an animated GIF), and the phone and 10-inch tablet screenshots -
# rendered from the app by scripts/generate-store-assets.sh (see .claude/STORE_ASSETS.md), shrunk to PNGs, and uploaded
# to the standalone `readme-assets` release. It runs on its own, beside android-release.yml rather than after it: on a
# push to main that changes what the Android app shows (the same paths android-release.yml watches), or how the
# images are made (the store-assets script, captions and generator tests). Not waiting for the release means a push
# whose release fails still refreshes the images. The workflow_dispatch trigger refreshes them on demand (Actions tab,
# or `gh workflow run readme-assets.yml`).
#
# That release is an ASSET HOST, not a software release: it carries no version, is never marked Latest, and --clobber
# replaces its files in place, so README.md can embed permanent URLs
# (`releases/download/readme-assets/<name>`). A failed refresh leaves the previous images up rather than breaking
# them. The README names each file, so a screenshot renamed or dropped in StoreScreensGeneratorTest needs README.md
# changed with it (the old file stays on the release until it is deleted by hand). Its tag isn't an `android-v*` or
# `v*` tag, so the changelog and the Baseline Profile's lap count never take it for a release.
#
# THIS NEEDS THE REPOSITORY'S "Immutable releases" SETTING TO STAY OFF. A release published while it is on is frozen
# (its assets can never be replaced), and its tag name is reserved for good: deleting the release doesn't free it.
#
# ubuntu-latest ships ImageMagick 6, without the `magick` the script uses; install_imagemagick.sh installs the same
# ImageMagick 7 build the sandbox has.
on:
  push:
    branches: [main]
    paths:
      # What android-release.yml releases...
      - "VERSION"
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "build-logic/**"
      - "gradle.properties"
      - "!app/**/src/jvmMain/**"
      - "!app/**/src/test/**"
      - "!app/**/src/testPlay/**"
      - "!app/**/src/testGithub/**"
      - "!app/**/src/commonTest/**"
      - "!app/**/src/androidHostTest/**"
      - "!app/**/src/jvmTest/**"
      - "!app/**/src/androidTest/**"
      - "!app/**/*.md"
      # ...and how the images are made (after the exclusions, which would otherwise drop the generator tests).
      - "app/android/src/test/kotlin/net/zodac/dicefive/store/**"
      - "scripts/generate-store-assets.sh"
      - "scripts/store-assets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-assets
  cancel-in-progress: false

jobs:
  readme-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the build
        uses: ./.github/actions/build-setup
        with:
          ffmpeg: "true"

      # The runtime android-release.yml's android-tests job caches (see there). Only restored: on a miss, Gradle downloads it.
      - name: Read what picks Robolectric's runtime
        id: robolectric
        run: |
          echo "version=$(grep -oP '^robolectric = "\K[^"]+' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
          echo "sdk=$(grep -oP '^sdk=\K[0-9]+' app/android/src/test/resources/robolectric.properties)" >> "$GITHUB_OUTPUT"

      - name: Restore Robolectric's runtime
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ steps.robolectric.outputs.version }}-sdk${{ steps.robolectric.outputs.sdk }}

      - name: Install ImageMagick 7
        run: .github/scripts/install_imagemagick.sh

      - name: Render the feature graphic and screenshots
        run: scripts/generate-store-assets.sh --parts feature,phone,tablet

      # The store's PNGs are about 1MB each; at the README's size a few hundred KB. Phone shots at 540px wide and tablet
      # ones at 1280px, both twice the width the README shows them at; the GIF is the script's, at 1024x500.
      - name: Shrink them for the README
        run: |
          out="assets/$(tr -d '[:space:]' < VERSION)"
          mkdir readme-assets
          cp "$out/feature-graphic.gif" readme-assets/feature-graphic.gif
          for shot in "$out"/phone/*.png; do
            magick "$shot" -filter Lanczos -resize 540x -strip -quality 95 PNG24:"readme-assets/$(basename "$shot")"
          done
          for shot in "$out"/tablet-10/*.png; do
            magick "$shot" -filter Lanczos -resize 1280x -strip -quality 95 PNG24:"readme-assets/$(basename "$shot")"
          done
          ls -l readme-assets

      - name: Hand them to the upload job
        uses: actions/upload-artifact@v7
        with:
          name: readme-assets
          path: readme-assets/
          if-no-files-found: error
          retention-days: 1

  # The upload on its own, as the one job with write access: the render above runs Gradle, its plugins and the app's
  # dependencies, none of which needs it.
  upload:
    needs: readme-assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the images
        uses: actions/download-artifact@v8
        with:
          name: readme-assets
          path: readme-assets/

      # Created on first use, so it needs no setup by hand.
      - name: Upload them to the readme-assets release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view readme-assets > /dev/null 2>&1; then
            gh release create readme-assets \
              --title "README assets" \
              --latest=false \
              --notes "Images for README.md: the feature graphic and screenshots of the latest release. Not a software release; its files are replaced after every release."
          fi
          gh release upload readme-assets --clobber readme-assets/*.png readme-assets/feature-graphic.gif
