name: Release

# Every push to main that changes shipped code (see the paths filter below) builds, tests, and publishes a GitHub Release for the
# version currently in the root VERSION file, then commits VERSION bumped
# to the next patch version back to main (e.g. 0.0.1 -> 0.0.2) so
# development always continues one patch ahead of the last release. That
# bump-commit is pushed with the default GITHUB_TOKEN, which GitHub does
# not use to re-trigger workflows, so this can't loop.
#
# For a minor/major bump (e.g. starting a 0.1.0 line), edit VERSION by hand
# (or run scripts/set-version.sh) and push that - the next run releases
# that version, then resumes patch-bumping from it (0.1.0 -> 0.1.1 -> ...).
#
# The release's description is RELEASE_NOTES.md (the maintainer's own summary, written before
# pushing) followed by every commit since the previous release, grouped by the "[Category]" at the
# start of its subject line (scripts/release-changelog.sh; the format is enforced locally by
# .githooks/commit-msg). The bump commit afterwards also empties RELEASE_NOTES.md, ready for the
# next release's notes.
#
# Versions below 1.0.0 are pre-1.0 milestones, not real releases: they're
# marked as GitHub pre-releases and get no APK asset - just a version bump
# recorded as a tagged release. Signing/building only happens once VERSION
# reaches 1.0.0, unless the force_apk dispatch input below overrides that.
#
# The checks run side by side, each on a runner of its own - the app's Robolectric tests, the shared
# module's tests with its iOS compile, lint, and (once there's an APK to ship) the Baseline Profile,
# which stops itself if a check fails. The signed APK is built with that profile once it and every check
# have passed, and the release itself is made only once all of that has. Each job sets itself up
# through .github/actions/build-setup.
#
# Only a push that touches what ships triggers a release: app sources and resources, the Gradle
# build and the VERSION file. Docs, CI, tooling, test code and Markdown files don't build a new
# release. The workflow_dispatch trigger below still releases on demand.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "VERSION"
      # ...except test code and documentation inside those.
      - "!app/**/src/test/**"
      - "!app/**/src/commonTest/**"
      - "!app/**/src/androidHostTest/**"
      - "!app/**/src/androidTest/**"
      - "!app/**/*.md"
  # Lets a release for the VERSION currently on main be triggered on demand
  # (Actions tab, or `gh workflow run release.yml`) instead of only ever
  # firing from a push - useful when a push-triggered run failed partway
  # (e.g. a red unit-test run) and left main sitting on an unreleased
  # VERSION with nothing to re-trigger it.
  workflow_dispatch:
    inputs:
      force_apk:
        description: "Build and attach the APK even if VERSION is still below 1.0.0 (release stays marked as a pre-release)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # What's being released, read once for the jobs that need it.
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          major="${version%%.*}"
          if [ "$major" -ge 1 ]; then stable=true; else stable=false; fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"

  # app:android's unit tests - Robolectric, so the slowest of the checks.
  android-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the build
        uses: ./.github/actions/build-setup
        with:
          ffmpeg: "true"

      - name: Run app unit tests
        run: ./gradlew :app:android:testDebugUnitTest --console=plain

  # app:shared's tests on the JVM, and its compile for both iOS targets (the check that its common code
  # stays platform-neutral) - see the testDebugUnitTest task in app/shared/build.gradle.kts.
  shared-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the build
        uses: ./.github/actions/build-setup
        with:
          kotlin-native: "true"

      - name: Run shared tests and the iOS compile
        run: ./gradlew :app:shared:testDebugUnitTest --console=plain

  # Deprecation gates. Any compile already fails on a deprecated API (the Kotlin DEPRECATION flag in
  # app/android/build.gradle.kts) or a build-script warning (org.gradle.kotlin.dsl.allWarningsAsErrors in
  # gradle.properties); this extends that to the instrumented-test code, which nothing else here
  # compiles, and runs lint, where Deprecated / ObsoleteSdkInt findings are errors.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the build
        uses: ./.github/actions/build-setup
        with:
          ffmpeg: "true"

      - name: Check instrumented tests compile and lint passes
        run: ./gradlew compileDebugAndroidTestKotlin lintDebug --console=plain

  # A fresh Baseline Profile for every APK: the profile journey (app/baselineprofile) run on an
  # emulator, from this commit. Only when there's an APK to put it in. The profile is not committed (it is
  # gitignored); it goes to the apk job as an artifact. A failing journey - usually a relabelled button
  # it looks for - fails the job at once, and with it the release, rather than shipping a thinner
  # profile. Only an emulator that fails to boot is retried (once), since that says nothing about the
  # journey. The emulator and the journey are explained in .claude/EMULATOR.md; the journey in
  # .claude/DESIGN.md Phase 19.
  #
  # Timeouts: a lap of the journey is ~2 minutes on a 4-core sandbox emulator, and a hosted runner is at
  # least three times slower - a 60-minute step timed out with laps still to run. The step stops at 150
  # (a boot of up to 10, the benchmark build, 10 laps, room for one retried boot) and fails like a failed
  # journey, so its report is still uploaded; the job's own 170 is the backstop for a hang anywhere else
  # (setup, the cache, an upload). Each lap's start is printed in the step's log, so a slow run shows how
  # far it got.
  #
  # It runs alongside the checks but is no use once one of them fails (nothing will be released), so it
  # watches them and stops itself when one does - see watch_checks.sh.
  baseline-profile:
    needs: version
    if: needs.version.outputs.stable == 'true' || inputs.force_apk == true
    runs-on: ubuntu-latest
    timeout-minutes: 170
    permissions:
      contents: read
      actions: read # watch_checks.sh reads this run's jobs
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # In the background for the rest of the job: it writes the marker file, and stops Gradle and the
      # emulator, as soon as a check fails. The generate step below reads the marker so it neither starts
      # nor retries once that has happened.
      - name: Watch the checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nohup .github/scripts/watch_checks.sh "$RUNNER_TEMP/checks-failed" android-tests shared-tests lint \
            > "$RUNNER_TEMP/watch-checks.log" 2>&1 &

      - name: Set up the build
        uses: ./.github/actions/build-setup
        with:
          ffmpeg: "true"

      # The emulator's Android version is sandbox/Dockerfile's EMULATOR_API (see ci_emulator.sh). The SDK's
      # path is read here too: the runner's own environment isn't in the `env` context the cache reads.
      - name: Read the emulator's Android version
        id: emulator
        run: |
          echo "api=$(grep -oP '^ENV EMULATOR_API=\K[0-9.]+' sandbox/Dockerfile)" >> "$GITHUB_OUTPUT"
          echo "sdk=$ANDROID_HOME" >> "$GITHUB_OUTPUT"

      # About 1.5 GB to download otherwise. Keyed on the Android version: the emulator and its image
      # can't be pinned to a revision, so a cached pair is kept until EMULATOR_API moves. Restored and saved
      # as separate steps: actions/cache only saves when the whole job passes, so a failed journey would
      # leave the next run downloading them again.
      - name: Restore the emulator and its system image
        id: emulator-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.emulator.outputs.sdk }}/emulator
            ${{ steps.emulator.outputs.sdk }}/system-images/android-${{ steps.emulator.outputs.api }}
          key: emulator-${{ runner.os }}-api${{ steps.emulator.outputs.api }}

      # 10 laps: the journey's timing races only showed up from lap 4, so a short run doesn't prove it.
      # Only the boot is retried; a failed journey ends the step there and then (see the job's comment).
      # The benchmark library logs "Compile iteration (N)" as each lap starts; those lines are echoed here
      # (Gradle prints nothing until the tests end).
      - name: Generate the Baseline Profile
        timeout-minutes: 150
        run: |
          checks_failed() {
            if [ -f "$RUNNER_TEMP/checks-failed" ]; then
              echo "::error::$(cat "$RUNNER_TEMP/checks-failed") failed - the Baseline Profile was stopped"
              return 0
            fi
            return 1
          }
          for attempt in 1 2; do
            if checks_failed; then exit 1; fi
            if ! .github/scripts/ci_emulator.sh start; then
              .github/scripts/ci_emulator.sh stop
              echo "::warning::The emulator failed to boot (attempt $attempt)"
              continue
            fi
            adb logcat -v time -s Benchmark:D -e "Compile iteration" &
            trap 'kill $! 2>/dev/null || true' EXIT
            if ./gradlew :app:android:generateBaselineProfile \
                -Pandroid.testInstrumentationRunnerArguments.journeyLaps=10 --console=plain; then
              exit 0
            fi
            if checks_failed; then exit 1; fi
            .github/scripts/ci_emulator.sh screenshot "$RUNNER_TEMP/journey-failure.png" || true
            .github/scripts/ci_emulator.sh stop
            echo "::error::Baseline Profile generation failed - see the baseline-profile-report artifact"
            exit 1
          done
          echo "::error::The emulator failed to boot twice"
          exit 1

      # Whether or not the journey passed: ci_emulator.sh installed them if the restore missed.
      - name: Save the emulator and its system image
        if: always() && steps.emulator-cache.outputs.cache-hit != 'true'
        continue-on-error: true # nothing to save if the step stopped before installing them
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.emulator.outputs.sdk }}/emulator
            ${{ steps.emulator.outputs.sdk }}/system-images/android-${{ steps.emulator.outputs.api }}
          key: ${{ steps.emulator-cache.outputs.cache-primary-key }}

      - name: Upload the journey's report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-profile-report
          path: |
            ${{ runner.temp }}/watch-checks.log
            app/baselineprofile/build/reports/androidTests/
            ${{ runner.temp }}/journey-failure.png
            ${{ runner.temp }}/emulator-*.log
          retention-days: 7

      - name: Hand the profile to the apk job
        uses: actions/upload-artifact@v7
        with:
          name: baseline-profile
          path: app/android/src/release/generated/baselineProfiles/
          if-no-files-found: error
          retention-days: 1

  # The signed release APK, built with the Baseline Profile generated above - only from 1.0.0 on, unless
  # force_apk asks for one sooner, and only once the profile and every check have passed (there's no use
  # for an APK that won't be released). Handed to the release job as an artifact.
  apk:
    needs: [version, android-tests, shared-tests, lint, baseline-profile]
    if: needs.version.outputs.stable == 'true' || inputs.force_apk == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the build
        uses: ./.github/actions/build-setup
        with:
          ffmpeg: "true"

      # Where AGP merges it into the release build (alongside the hand-written src/main/baseline-prof.txt).
      - name: Fetch the Baseline Profile
        uses: actions/download-artifact@v8
        with:
          name: baseline-profile
          path: app/android/src/release/generated/baselineProfiles/

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore.jks"

      - name: Build release APK
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore.jks
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      # app/android/build.gradle.kts names outputs DiceFive-<version>-<buildType>.apk (signed here, so no
      # -unsigned suffix).
      - name: Rename APK for release
        run: cp "app/android/build/outputs/apk/release/DiceFive-${{ needs.version.outputs.name }}-release.apk" "DiceFive-${{ needs.version.outputs.name }}.apk"

      - name: Hand the APK to the release job
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: DiceFive-${{ needs.version.outputs.name }}.apk
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [version, android-tests, shared-tests, lint, baseline-profile, apk]
    # Every check must have passed; the profile and APK jobs may have been skipped (a pre-1.0 release has
    # none), but not have failed. The profile is checked as well as the APK: a failed profile job makes
    # the apk job skip, not fail, which on its own would let a release out without its APK.
    if: >-
      !cancelled() &&
      needs.version.result == 'success' &&
      needs.android-tests.result == 'success' &&
      needs.shared-tests.result == 'success' &&
      needs.lint.result == 'success' &&
      (needs.baseline-profile.result == 'success' || needs.baseline-profile.result == 'skipped') &&
      (needs.apk.result == 'success' || needs.apk.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the release description lists every commit since the previous
      # release's tag, which a shallow clone wouldn't have.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch the APK
        id: apk
        if: needs.apk.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: release-apk

      # RELEASE_NOTES.md as written (skipped if empty), then the grouped commit list. A copy of the
      # notes is kept aside so the bump step below can tell whether RELEASE_NOTES.md on main is
      # still the text this release shipped with.
      - name: Compose release description
        id: notes
        run: |
          body="$RUNNER_TEMP/release-body.md"
          cp RELEASE_NOTES.md "$RUNNER_TEMP/released-notes.md"
          {
            if grep -q '[^[:space:]]' RELEASE_NOTES.md; then
              cat RELEASE_NOTES.md
              echo
            fi
            ./scripts/release-changelog.sh "${{ needs.version.outputs.name }}"
          } > "$body"
          cat "$body"
          echo "path=$body" >> "$GITHUB_OUTPUT"

      - name: Create/update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.name }}
          name: DiceFive v${{ needs.version.outputs.name }}
          prerelease: ${{ needs.version.outputs.stable != 'true' }}
          files: ${{ needs.apk.result == 'success' && format('DiceFive-{0}.apk', needs.version.outputs.name) || '' }}
          body_path: ${{ steps.notes.outputs.path }}

      # Only reached once everything above has succeeded, so a failed build
      # never bumps the version. Re-syncs with the current main tip first in
      # case it moved during this run, since `concurrency` only serializes
      # this workflow's own runs, not unrelated pushes from elsewhere.
      #
      # RELEASE_NOTES.md is emptied for the next release - but only if it still
      # holds exactly what this release shipped with. If notes for the next
      # release were pushed while this run was going, they're left alone.
      - name: Bump version for next development iteration
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          ./scripts/bump-patch-version.sh
          if cmp -s RELEASE_NOTES.md "$RUNNER_TEMP/released-notes.md"; then
            : > RELEASE_NOTES.md
          else
            echo "RELEASE_NOTES.md changed on main during this run - leaving it for the next release"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION RELEASE_NOTES.md
          git commit -m "[Release] Bump version to $(cat VERSION) [skip ci]"
          git push origin main
