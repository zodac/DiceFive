name: Release

# Every push to main builds, tests, and publishes a GitHub Release for the
# version currently in the root VERSION file, then commits VERSION bumped
# to the next patch version back to main (e.g. 0.0.1 -> 0.0.2) so
# development always continues one patch ahead of the last release. That
# bump-commit is pushed with the default GITHUB_TOKEN, which GitHub does
# not use to re-trigger workflows, so this can't loop.
#
# For a minor/major bump (e.g. starting a 0.1.0 line), edit VERSION by hand
# (or run scripts/set-version.sh) and push that - the next run releases
# that version, then resumes patch-bumping from it (0.1.0 -> 0.1.1 -> ...).
#
# Versions below 1.0.0 are pre-1.0 milestones, not real releases: they're
# marked as GitHub pre-releases and get no APK asset - just a version bump
# recorded as a tagged release. Signing/building only happens once VERSION
# reaches 1.0.0, unless the force_apk dispatch input below overrides that.
on:
  push:
    branches: [main]
  # Lets a release for the VERSION currently on main be triggered on demand
  # (Actions tab, or `gh workflow run release.yml`) instead of only ever
  # firing from a push - useful when a push-triggered run failed partway
  # (e.g. a red unit-test run) and left main sitting on an unreleased
  # VERSION with nothing to re-trigger it.
  workflow_dispatch:
    inputs:
      force_apk:
        description: "Build and attach the APK even if VERSION is still below 1.0.0 (release stays marked as a pre-release)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest runners ship a full Android SDK pre-installed (cmdline-tools,
      # licenses already accepted) - just install the specific packages this project
      # pins. (android-actions/setup-android@v3 was tried here but fails on current
      # runners: it also tries to install the long-removed legacy "tools" package.)
      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          major="${version%%.*}"
          if [ "$major" -ge 1 ]; then stable=true; else stable=false; fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Decode release keystore
        if: steps.version.outputs.stable == 'true' || inputs.force_apk == true
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore.jks"

      - name: Build release APK
        if: steps.version.outputs.stable == 'true' || inputs.force_apk == true
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore.jks
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: Rename APK for release
        if: steps.version.outputs.stable == 'true' || inputs.force_apk == true
        id: apk
        run: |
          path="DiceFive-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/DiceFive-release.apk "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Create/update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: DiceFive v${{ steps.version.outputs.name }}
          prerelease: ${{ steps.version.outputs.stable != 'true' }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true

      # Only reached once everything above has succeeded, so a failed build
      # never bumps the version. Re-syncs with the current main tip first in
      # case it moved during this run, since `concurrency` only serializes
      # this workflow's own runs, not unrelated pushes from elsewhere.
      - name: Bump version for next development iteration
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          ./scripts/bump-patch-version.sh
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "Bump version to $(cat VERSION) [skip ci]"
          git push origin main
