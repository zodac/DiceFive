name: iOS

# The iOS app, built and tested on macOS runners. See .claude/IOS_SUPPORT.md.
#
#   tests        app:shared's tests on the iOS simulator (iosSimulatorArm64Test): commonTest and iosTest.
#   screenshots  the app on a simulated iPhone, toured by ScreenTourTests (app/ios/DiceFiveUITests), a PNG per screen
#                uploaded as the "ios-screenshots" artifact. The iOS counterpart of the render skill.
#   ipa          the app for a real iPhone, unsigned, as DiceFive-<version>-<configuration>.ipa, for Sideloadly to sign
#                with an Apple ID and install. The dSYMs ride along for reading crash reports.
#
# The Xcode project is generated from app/ios/project.yml (XcodeGen); its build phase builds the Kotlin framework
# through Gradle. Debug matches the debug APK (debug-only features on, Kotlin unoptimised); Release is what a store
# build runs.
#
# Runs on pushes to main and pull requests that touch the shared code, the iOS app or the build, and on demand
# (Actions tab, or `gh workflow run ios.yml -f configuration=Release`). It releases nothing.
on:
  push:
    branches: [main]
    paths: &ios-paths
      - "app/shared/**"
      - "app/ios/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "VERSION"
      - ".github/workflows/ios.yml"
      - ".github/actions/build-setup/**"
  pull_request:
    paths: *ios-paths
  workflow_dispatch:
    inputs:
      configuration:
        description: "Xcode build configuration for the IPA"
        type: choice
        options: [Debug, Release]
        default: Debug

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the build
        uses: ./.github/actions/build-setup
        with:
          kotlin-native: "true"

      - name: Run the shared tests on the iOS simulator
        run: ./gradlew :app:shared:iosSimulatorArm64Test --console=plain

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-report
          path: app/shared/build/reports/tests/iosSimulatorArm64Test/

  screenshots:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the build
        uses: ./.github/actions/build-setup
        with:
          kotlin-native: "true"

      - name: Show Xcode
        run: xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec app/ios/project.yml

      # The largest current non-Max iPhone the runner's newest iOS runtime has, so the shots look like a typical phone.
      - name: Pick a simulator
        id: simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          udid="$(jq -r '
            [.devices | to_entries[] | select(.key | test("iOS")) | .value[]] as $all
            | ([$all[] | select(.name | test("^iPhone [0-9]+ Pro$"))] | last // empty | .udid)
              // ([$all[] | select(.name | startswith("iPhone"))] | last | .udid)
          ' "$RUNNER_TEMP/devices.json")"
          echo "Simulator: $(jq -r --arg u "$udid" '.devices[][] | select(.udid == $u) | .name' "$RUNNER_TEMP/devices.json") ($udid)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Tour the screens
        env:
          TEST_RUNNER_SCREENSHOT_DIR: ${{ github.workspace }}/build/ios-screenshots
        run: |
          mkdir -p "$TEST_RUNNER_SCREENSHOT_DIR"
          xcodebuild test \
            -project app/ios/DiceFive.xcodeproj \
            -scheme DiceFive \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build/ios \
            -resultBundlePath build/ios-tour.xcresult \
            MARKETING_VERSION="$(tr -d '[:space:]' < VERSION)" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-screenshots
          path: build/ios-screenshots/
          if-no-files-found: warn

      - name: Upload the test result
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-tour-xcresult
          path: build/ios-tour.xcresult

  ipa:
    runs-on: macos-latest
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the build
        uses: ./.github/actions/build-setup
        with:
          kotlin-native: "true"

      - name: Show Xcode
        run: xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec app/ios/project.yml

      - name: Build the app (unsigned)
        run: |
          xcodebuild build \
            -project app/ios/DiceFive.xcodeproj \
            -scheme DiceFive \
            -configuration "${CONFIGURATION}" \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/ios \
            MARKETING_VERSION="$(tr -d '[:space:]' < VERSION)" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # An .ipa is a zip with the app under Payload/. Unsigned, so only a re-signing installer can use it.
      - name: Package the IPA
        id: ipa
        run: |
          name="DiceFive-$(tr -d '[:space:]' < VERSION)-${CONFIGURATION}"
          products="build/ios/Build/Products/${CONFIGURATION}-iphoneos"
          mkdir -p build/ipa/Payload
          cp -R "${products}/DiceFive.app" build/ipa/Payload/
          (cd build/ipa && zip -qry "${GITHUB_WORKSPACE}/build/${name}.ipa" Payload)
          (cd "${products}" && zip -qry "${GITHUB_WORKSPACE}/build/${name}-dSYM.zip" DiceFive.app.dSYM)
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload the IPA
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ipa.outputs.name }}
          path: |
            build/${{ steps.ipa.outputs.name }}.ipa
            build/${{ steps.ipa.outputs.name }}-dSYM.zip
          if-no-files-found: error
