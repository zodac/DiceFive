name: Pages

# Publishes docs/ (the privacy policy - see .claude/PUBLISHING.md) to GitHub Pages, only when
# something under docs/ changes on main. This replaces GitHub's built-in "pages-build-deployment",
# which rebuilds the site on every push to main whatever it touched. For this workflow to be the one
# that deploys, the repo's Settings -> Pages -> "Build and deployment" -> Source must be set to
# "GitHub Actions" (not "Deploy from a branch"); the published URL stays the same.
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  # For a first deploy after switching the Pages source over, or a re-publish without a docs change.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one, but never cancels one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # The same Jekyll build the branch-based deploy ran, so docs/*.md still render as pages.
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
