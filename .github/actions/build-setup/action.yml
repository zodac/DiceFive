name: Build setup
description: >-
  Everything a Gradle job here needs before it runs: the JDK, the Android SDK packages (unless turned
  off), Gradle with its caches - and, when asked, ffmpeg (for the apps' sound effects) and the Kotlin/Native
  toolchain (for app:shared's iOS compile). Shared by android-release.yml's parallel jobs and the iOS workflows;
  runs after actions/checkout.

inputs:
  ffmpeg:
    description: "Install ffmpeg - scripts/normalize-audio.sh needs it: app:android's resources, and the iOS app"
    default: "false"
  kotlin-native:
    description: "Restore and save the Kotlin/Native toolchain - only app:shared's iOS tasks use it"
    default: "false"
  android-sdk:
    description: "Install the Android SDK packages (Linux runners). app:shared's iOS tasks build without them"
    default: "true"
  xcodegen:
    description: "Install XcodeGen (macOS runners) - generates the iOS app's Xcode project"
    default: "false"

runs:
  using: composite
  steps:
    # The Java version is owned by the Gradle toolchain (gradle/gradle-daemon-jvm.properties), which
    # Gradle would download itself; installing the same JDK here just saves it that download. Read
    # at run time rather than pinned here, so a JDK move never has to edit this file.
    - name: Read the Java version from the Gradle toolchain
      id: java
      shell: bash
      run: echo "version=$(sed -n 's/^toolchainVersion=\([0-9]*\).*/\1/p' gradle/gradle-daemon-jvm.properties)" >> "$GITHUB_OUTPUT"

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ steps.java.outputs.version }}

    # ubuntu-latest runners ship a full Android SDK pre-installed (cmdline-tools, licenses already
    # accepted) - just install the specific packages this project builds against, which
    # android_sdk_packages.sh reads from app/android/build.gradle.kts (not pinned here, for the same
    # reason as the JDK above). (android-actions/setup-android@v3 was tried here but fails on current
    # runners: it also tries to install the long-removed legacy "tools" package.)
    - name: Install required Android SDK packages
      if: inputs.android-sdk == 'true'
      shell: bash
      run: |
        ANDROID_CLI="$ANDROID_HOME/cmdline-tools/latest/bin/android"
        read -ra packages <<< "$(.github/scripts/android_sdk_packages.sh)"
        if [ -x "$ANDROID_CLI" ]; then
          "$ANDROID_CLI" sdk install --sdk="$ANDROID_HOME" "${packages[@]}"
        else
          # The runner's cmdline-tools predate the android CLI, so sdkmanager is the only installer.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # yes always exits non-zero here (sdkmanager stops reading, so yes hits a broken pipe), which
          # `shell: bash`'s pipefail would take as the step failing; only sdkmanager's own status counts.
          { yes 2>/dev/null || true; } | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "${packages[@]}"
        fi

    # scripts/normalize-audio.sh shells out to ffmpeg to peak-normalise the clips in app/audio/ (for
    # Android's normalizeOggAudio task and the iOS app's build phase), and ubuntu-latest runners don't
    # ship it. The runner's own package lists are tried first - refreshing them is most of this step's
    # time - and only refreshed if they can't find it.
    - name: Install ffmpeg
      if: inputs.ffmpeg == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends ffmpeg || {
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
        }

    # The same on macOS, from Homebrew, unless the runner image already has it. Homebrew's downloads are cached
    # (renewed monthly, so the bottles don't go stale), and it neither updates itself nor tidies up first: the
    # self-update is a fixed cost on every `brew install`, and the runner is thrown away anyway.
    - name: Month for the Homebrew cache
      id: month
      if: runner.os == 'macOS' && (inputs.ffmpeg == 'true' || inputs.xcodegen == 'true')
      shell: bash
      run: echo "value=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

    - name: Cache Homebrew downloads
      if: runner.os == 'macOS' && (inputs.ffmpeg == 'true' || inputs.xcodegen == 'true')
      uses: actions/cache@v6
      with:
        path: ~/Library/Caches/Homebrew
        key: brew-${{ runner.os }}-${{ runner.arch }}-${{ steps.month.outputs.value }}-ffmpeg-${{ inputs.ffmpeg }}-xcodegen-${{ inputs.xcodegen }}
        restore-keys: |
          brew-${{ runner.os }}-${{ runner.arch }}-${{ steps.month.outputs.value }}-

    - name: Install ffmpeg (macOS)
      if: inputs.ffmpeg == 'true' && runner.os == 'macOS'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
      run: command -v ffmpeg > /dev/null || brew install ffmpeg

    - name: Install XcodeGen (macOS)
      if: inputs.xcodegen == 'true' && runner.os == 'macOS'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
      run: command -v xcodegen > /dev/null || brew install xcodegen

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    # The iOS compile (the check that app:shared's common code stays platform-neutral) needs the
    # Kotlin/Native toolchain - a few hundred MB that Gradle otherwise downloads into ~/.konan on every
    # run. setup-gradle doesn't cache it. Keyed on the version catalog, where the Kotlin version lives;
    # a partial match still restores the last toolchain, so only a Kotlin bump downloads a new one.
    # Per job, too: ~/.konan also holds the compiled caches of the libraries a link uses, which take
    # minutes to build, and each job links for its own target (simulator tests, simulator app, device app).
    - name: Cache Kotlin/Native toolchain
      if: inputs.kotlin-native == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ github.job }}-${{ hashFiles('gradle/libs.versions.toml') }}
        restore-keys: |
          konan-${{ runner.os }}-${{ github.job }}-
          konan-${{ runner.os }}-
