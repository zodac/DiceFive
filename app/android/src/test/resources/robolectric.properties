# Every Robolectric test runs on one SDK with native graphics, so the whole suite shares one sandbox: each
# distinct SDK or graphics mode builds its own, at several seconds apiece. A class sets only its qualifiers.
#
# Native graphics, because the legacy mode measures every character as one pixel and draws no bitmaps - text-fit,
# screenshot and layout tests would pass for the wrong reasons.
#
# 36, not the app's targetSdk 37: under Robolectric 4.17 the 37 runtime's captured frames can lag a change (the cup
# test failed on a different cup each run, where 36 passes every time). Try 37 again with a newer Robolectric.
# (Both need --add-exports=java.base/jdk.internal.access, in the root build.gradle.kts.)
sdk=36
graphicsMode=NATIVE
