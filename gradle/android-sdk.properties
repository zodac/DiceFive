# The Android SDK levels and tools every module builds with - the one place they are set. build-logic's AndroidSdk
# reads this file for :app:android, :app:shared and :app:baselineprofile alike, and .github/scripts/android_sdk_packages.sh
# and .github/scripts/update_dependency_versions.sh read and edit it, so keep each a plain `name=value` line.

# The platform compiled against: 37.2. Minor SDK releases add APIs and are their own SDK platform (android-37.2, pinned to
# match in ai-sandbox-configuration/Dockerfile; the workflows read it from here via .github/scripts/android_sdk_packages.sh). Only
# compileSdk has a minor (0 for a base release): targetSdk and minSdk are whole API levels, so targetSdk 37 already
# covers every 37.x. The monthly dependency update moves compileSdk; it never moves targetSdk or minSdk.
compileSdk=37
compileSdkMinor=2
minSdk=26
targetSdk=37

# Pinned to match the build-tools baked into the sandbox image (ai-sandbox-configuration/Dockerfile) so a build never needs to fetch a
# different version over the network. AGP 9.4.1 enforces build-tools >= 36.0.0 and silently overrides a lower pin rather
# than failing on it, so this documents what AGP would use anyway instead of choosing it.
buildToolsVersion=36.0.0

# The app has no native code of its own, but AndroidX ships some (see `packaging` in app/android/build.gradle.kts). The
# NDK extracts their symbol tables for Play (`debugSymbolLevel` in the release build type) and strips the libraries;
# without it AGP warns and does neither. Pinned to match ai-sandbox-configuration/Dockerfile; the dependency update moves it to the newest
# stable NDK that extracts the symbols.
ndkVersion=30.0.16248370
